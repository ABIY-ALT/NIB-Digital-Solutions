# Local development infrastructure for AppCore (PostgreSQL + Redis).
# Usage (from appcore/backend):  docker compose up -d
name: appcore

services:
  postgres:
    image: postgres:18-alpine
    container_name: appcore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: appcore
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: User@123456
    ports:
      - '5432:5432'
    volumes:
      - appcore-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d appcore']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: appcore-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - appcore-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  appcore-postgres-data:
  appcore-redis-data:
